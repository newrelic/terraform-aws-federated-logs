name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Setup
  # ──────────────────────────────────────────────────────────────
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.set-matrix.outputs.paths }}
    steps:
      - id: set-matrix
        run: |
          echo 'paths=[{"name":"root","path":"."},{"name":"examples-data-processing","path":"examples/data_processing"},{"name":"examples-federated-logs-setup","path":"examples/federated_logs_setup"},{"name":"data_processing","path":"modules/data_processing"},{"name":"federated_logs_partition","path":"modules/federated_logs_partition"},{"name":"federated_logs_role","path":"modules/federated_logs_role"},{"name":"federated_logs_setup_resource","path":"modules/federated_logs_setup_resource"}]' >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # PR Title Lint
  # ──────────────────────────────────────────────────────────────
  lint-pr-title:
    name: Lint PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            update
            Update
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?:? (.*)$'
          headerPatternCorrespondence: type, scope, subject

  # ──────────────────────────────────────────────────────────────
  # Version Bump Check
  # ──────────────────────────────────────────────────────────────
  check-version-bump:
    name: latest.json bumped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Same type prefix lint-pr-title validates against. docs/chore PRs don't
      # ship a release, same as the old commit-analyzer rules did.
      - name: Determine PR type
        id: pr-type
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          type=$(echo "$PR_TITLE" | sed -E 's/^([A-Za-z]+).*/\1/' | tr '[:upper:]' '[:lower:]')
          echo "type=$type" >> "$GITHUB_OUTPUT"

      - name: Require latest.json bump
        if: steps.pr-type.outputs.type != 'docs' && steps.pr-type.outputs.type != 'chore'
        run: |
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- latest.json; then
            echo "latest.json wasn't bumped. Update the tag in latest.json so merging this PR cuts a release, or use a docs:/chore: PR title if no release is needed." >&2
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────
  # Terraform Validate
  # ──────────────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate — ${{ matrix.path.name }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.setup.outputs.paths) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.12.0"

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ${{ matrix.path.path }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ matrix.path.path }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.path.path }}
        env:
          NEW_RELIC_API_KEY: "dummy-for-validate"

  # ──────────────────────────────────────────────────────────────
  # TFLint
  # ──────────────────────────────────────────────────────────────
  tflint:
    name: TFLint — ${{ matrix.path.name }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.setup.outputs.paths) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.54.0

      - name: Copy TFLint config
        if: matrix.path.path != '.'
        run: |
          if [ -f ".tflint.hcl" ] && [ ! -f "${{ matrix.path.path }}/.tflint.hcl" ]; then
            cp .tflint.hcl "${{ matrix.path.path }}/.tflint.hcl"
          fi

      - name: Init TFLint (with AWS ruleset)
        run: tflint --init
        working-directory: ${{ matrix.path.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --format compact
        working-directory: ${{ matrix.path.path }}

  # ──────────────────────────────────────────────────────────────
  # Security Scan
  # ──────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run Trivy (IaC scan)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.30.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: 1
          severity: CRITICAL

  # ──────────────────────────────────────────────────────────────
  # Spell Check
  # ──────────────────────────────────────────────────────────────
  codespell:
    name: Check spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          check_filenames: true
          check_hidden: true
          skip: ./.git
          ignore_words_list: enver,NotIn,aks,commitish