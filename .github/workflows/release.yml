name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release from latest.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version comes from latest.json, not from commit messages.
      - name: Read tag from latest.json
        id: tag
        run: echo "tag=$(jq -r .tag latest.json)" >> "$GITHUB_OUTPUT"

      # Most merges to master don't bump latest.json, so most runs of this workflow
      # must no-op rather than re-release the same version.
      - name: Check if this tag already has a release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ steps.tag.outputs.tag }}" \
            -f sha="$(git rev-parse HEAD)"
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --generate-notes
          # GitHub attaches the source zip/tarball to every release automatically —
          # no separate build/zip step needed.