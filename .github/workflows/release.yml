name: Release

on:
  push:
    branches: [master]
    workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install semantic-release plugins
        run: npm install --no-save semantic-release@24 conventional-changelog-conventionalcommits@8 @semantic-release/exec

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Publish latest.json to latest branch
        if: hashFiles('latest.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(base64 < latest.json | tr -d '\n')
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/heads/latest" \
            -f sha="$(git rev-parse HEAD)" 2>/dev/null || true
          FILE_SHA=$(gh api "repos/${{ github.repository }}/contents/latest.json?ref=latest" \
            --jq '.sha' 2>/dev/null || echo "")
          ARGS=(-X PUT "repos/${{ github.repository }}/contents/latest.json" \
            -f message="chore: update latest.json" \
            -f content="$CONTENT" -f branch="latest")
          [ -n "$FILE_SHA" ] && ARGS+=(-f sha="$FILE_SHA")
          gh api "${ARGS[@]}"